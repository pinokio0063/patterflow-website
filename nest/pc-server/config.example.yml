# Filled by SETUP-CLOUDFLARE-TUNNEL.bat. Do not put credentials in git.
tunnel: REPLACE_UUID
credentials-file: REPLACE_TUNNEL.json
protocol: http2
originRequest:
  connectTimeout: 30s
  keepAliveTimeout: 90s
  disableChunkedEncoding: true
ingress:
  - hostname: nest-api.patternflow.fit
    service: http://127.0.0.1:9785
  - hostname: nesting-api.patternflow.fit
    service: http://127.0.0.1:9786
  - service: http_status:404
